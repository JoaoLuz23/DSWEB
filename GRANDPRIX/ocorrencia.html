<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CENTRAL DE OCORRÊNCIAS - Atendimento</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#e9c400",
                        "tertiary-container": "#ffd700",
                        "background": "#131313",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-container-highest": "#353535",
                        "on-background": "#e2e2e2",
                        "surface": "#131313"
                    },
                    "fontFamily": {
                        "headline": ["Lexend"],
                        "body": ["Lexend"]
                    }
                },
            },
        }
    </script>
    <style>
        body { background-color: #000000; font-family: 'Lexend', sans-serif; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel { backdrop-filter: blur(20px); background: rgba(19, 19, 19, 0.8); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0e0e0e; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #FFD700; }
        audio::-webkit-media-controls-panel { background-color: #FFD700; }
    </style>
</head>
<body class="text-on-background overflow-hidden h-screen flex flex-col">

<header class="bg-[#000000] border-b-4 border-[#353535] flex justify-between items-center w-full px-6 py-4 sticky top-0 z-50">
    <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-[#FFD700]"></span>
        <h1 class="font-['Lexend'] uppercase font-bold tracking-tight text-2xl text-[#FFD700]">CENTRAL DE OCORRÊNCIAS</h1>
    </div>
    <div class="hidden md:flex gap-6 items-center">
        <span class="text-[#FFD700] font-bold text-sm">OPERADOR 01</span>
        <div class="w-10 h-10 rounded-full bg-surface-container-highest border border-[#FFD700] flex items-center justify-center">
            <span class="material-symbols-outlined text-[#FFD700]">person</span>
        </div>
    </div>
</header>

<div class="flex flex-1 overflow-hidden">
    <aside class="hidden md:flex flex-col bg-[#0e0e0e] h-full w-72 z-40 border-r border-[#353535]">
        <nav class="flex-1 px-4 py-6 space-y-2">
            <button onclick="window.location.href='menu.html'" class="w-full flex items-center gap-4 px-4 py-3 text-[#FFD700] opacity-70 hover:opacity-100 hover:bg-[#353535] transition-all">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Início</span>
            </button>
            <button class="w-full flex items-center gap-4 px-4 py-3 bg-[#FFD700] text-black font-bold">
                <span class="material-symbols-outlined">chat</span>
                <span>Atendimento</span>
            </button>
            <button id="btn-historico" class="w-full flex items-center gap-4 px-4 py-3 text-[#FFD700] opacity-70 hover:opacity-100 hover:bg-[#353535] transition-all">
                <span class="material-symbols-outlined">history</span>
                <span>Histórico</span>
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col relative bg-background">
        <div class="p-6 border-b border-[#353535]">
            <h2 class="text-3xl font-bold uppercase text-[#FFD700]">Protocolo #6767</h2>
        </div>

        <div id="chat-container" class="flex-1 overflow-y-auto p-6 md:p-10 custom-scrollbar space-y-8">
            <div class="relative max-w-4xl">
                <div class="absolute -left-4 top-0 w-1 h-full bg-[#FFD700]"></div>
                <div class="bg-surface-container-lowest p-6 border border-[#353535]">
                    <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-[#999077] mb-4 block">Transcrição da Denúncia</label>
                    <p class="text-xl text-on-background font-light">"Estou sendo excluido no local de trabalho por conta de minha deficiencia auditiva"</p>
                </div>
            </div>
        </div>

        <div class="glass-panel border-t-4 border-[#353535] p-6 space-y-6">
            <div class="bg-surface-container-highest border-b-2 border-[#FFD700] p-4">
                <textarea id="campo-texto" class="w-full bg-transparent border-none focus:ring-0 text-on-background placeholder:text-[#999077] resize-none h-20" placeholder="Escreva sua resposta técnica..."></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <button id="btn-gravar" class="md:col-span-3 bg-[#FFD700] text-black flex flex-col items-center justify-center py-4 px-8 active:scale-95 transition-all">
                    <div class="flex items-center gap-4">
                        <span class="material-symbols-outlined text-3xl font-bold">mic</span>
                        <span class="text-xl font-black uppercase">Gravar Resposta</span>
                    </div>
                </button>
                <button id="btn-enviar" class="bg-surface-container-highest text-[#FFD700] border-2 border-[#FFD700] flex items-center justify-center py-4 px-8 hover:bg-[#FFD700] hover:text-black transition-all">
                    <span class="material-symbols-outlined">send</span>
                    <span class="text-lg font-bold uppercase ml-2">Enviar</span>
                </button>
            </div>
        </div>
    </main>
</div>

<nav class="md:hidden bg-[#000000] border-t-4 border-[#353535] flex justify-around items-center h-20 fixed bottom-0 left-0 w-full z-50">
    <button class="bg-[#FFD700] text-black h-full flex-1 font-bold uppercase">Chat</button>
    <button id="btn-historico-mobile" class="text-[#FFD700] h-full flex-1 uppercase">Histórico</button>
</nav>

<script>
    const irParaHistorico = () => window.location.href = 'bd.html';
    document.getElementById('btn-historico')?.addEventListener('click', irParaHistorico);
    document.getElementById('btn-historico-mobile')?.addEventListener('click', irParaHistorico);

    let mediaRecorder;
    let audioChunks = [];
    let gravando = false;
    let audioBlobURL = null;

    const btnGravar = document.getElementById('btn-gravar');
    const btnEnviar = document.getElementById('btn-enviar');
    const campoTexto = document.getElementById('campo-texto');
    const chatContainer = document.getElementById('chat-container');

    // Gravador de Áudio
    btnGravar.addEventListener('click', async () => {
        if (!gravando) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    audioBlobURL = URL.createObjectURL(audioBlob);
                    
                    document.getElementById('preview-audio')?.remove();
                    const player = document.createElement('audio');
                    player.id = 'preview-audio';
                    player.controls = true;
                    player.src = audioBlobURL;
                    player.className = "mt-2 h-8 w-full";
                    btnGravar.appendChild(player);
                };
                mediaRecorder.start();
                gravando = true;
                btnGravar.style.background = "#ff4444";
            } catch (err) { alert("Erro ao acessar microfone."); }
        } else {
            mediaRecorder.stop();
            gravando = false;
            btnGravar.style.background = "#FFD700";
        }
    });

    // Função para processar o áudio com delay de 5s e tocar 2 vezes sozinho
    function processarEnvioAudio(url) {
        setTimeout(() => {
            const divFila = document.createElement('div');
            divFila.className = "flex justify-end";
            const balao = document.createElement('div');
            balao.className = "max-w-2xl bg-[#FFD700] text-black p-6 relative shadow-lg";
            
            const label = document.createElement('label');
            label.className = "text-[10px] font-bold uppercase tracking-[0.2em] opacity-60 mb-2 block";
            label.innerText = "Resposta do Operador (Voz)";
            
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.src = url;
            audio.className = "w-full mt-2";

            let reproducoes = 0;
            // Toca sozinho quando estiver carregado
            audio.oncanplaythrough = () => {
                if (reproducoes === 0) audio.play();
            };

            // Ao terminar, toca de novo se for a primeira vez
            audio.onended = () => {
                reproducoes++;
                if (reproducoes < 2) {
                    setTimeout(() => audio.play(), 500); 
                }
            };

            balao.appendChild(label);
            balao.appendChild(audio);
            divFila.appendChild(balao);
            chatContainer.appendChild(divFila);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 5000); 
    }

    function adicionarMensagemTexto(conteudo) {
        const divFila = document.createElement('div');
        divFila.className = "flex justify-end";
        const balao = document.createElement('div');
        balao.className = "max-w-2xl bg-[#FFD700] text-black p-6 relative shadow-lg";
        const label = document.createElement('label');
        label.className = "text-[10px] font-bold uppercase tracking-[0.2em] opacity-60 mb-2 block";
        label.innerText = "Resposta do Operador";
        const p = document.createElement('p');
        p.className = "text-lg font-medium";
        p.innerText = conteudo;

        balao.appendChild(label);
        balao.appendChild(p);
        divFila.appendChild(balao);
        chatContainer.appendChild(divFila);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    btnEnviar.addEventListener('click', () => {
        const texto = campoTexto.value.trim();
        
        if (texto || audioBlobURL) {
            if (texto) {
                adicionarMensagemTexto(texto);
                campoTexto.value = "";
            }

            if (audioBlobURL) {
                const urlParaEnviar = audioBlobURL;
                processarEnvioAudio(urlParaEnviar);
                audioBlobURL = null; 
                document.getElementById('preview-audio')?.remove();
            }
        } else {
            alert("Escreva algo ou grave um áudio.");
        }
    });
</script>

</body>
</html>
