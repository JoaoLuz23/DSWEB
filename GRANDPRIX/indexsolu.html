<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alerta - Setor A</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: black;
  color: yellow;
}

/* animação de alerta */
@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.7; }
  100% { transform: scale(1); opacity: 1; }
}

.alerta {
  animation: pulse 1.2s infinite;
}
</style>

</head>

<body class="flex flex-col items-center justify-center min-h-screen text-center px-6">

<!-- 🚨 ÍCONE -->
<div class="text-7xl mb-6 alerta">⚠️</div>

<!-- TÍTULO -->
<h1 class="text-4xl font-bold mb-4">
  EMERGÊNCIA DETECTADA
</h1>

<!-- DESCRIÇÃO -->
<p class="text-xl mb-8 max-w-xl">
  Foi identificado que <strong>uma senhora caiu no Setor A</strong>.
</p>

<!-- STATUS -->
<div class="bg-yellow-400 text-black p-6 rounded-2xl mb-8 w-full max-w-md">
  <p class="text-lg font-semibold">
    Ação recomendada:
  </p>
  <p class="mt-2">
    Dirigir-se imediatamente ao local e prestar atendimento.
  </p>
</div>

<!-- BOTÕES -->
<div class="flex gap-4 flex-wrap justify-center">



</div>



</body>
</html>
